<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" href="/icono.svg" type="image/svg+xml">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f6f4}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Control de Galeras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra de control fija (granja · parvada · pestañas) sobre un tablero de lectura; tablas con scroll propio */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --panel-2:#eaeee8; --line:#d6dcd3; --ink:#18201b; --ink-2:#4b564e; --ink-3:#77827a;
  --accent:#1d6a52; --accent-ink:#ffffff; --accent-soft:#dcebe4;
  --s1:#2a78d6; --hist:#8b958d; --band:#e2e7e0;
  --good:#1a7f4b; --good-bg:#dff1e6; --warn:#a66300; --warn-bg:#fbeccc; --bad:#c23b3a; --bad-bg:#f8dcdb;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#1a1f1c; --panel-2:#232a26; --line:#313a35; --ink:#eef2ee; --ink-2:#b7c0b9; --ink-3:#8a948d;
  --accent:#5cc49c; --accent-ink:#0d1a14; --accent-soft:#1f3a2f;
  --s1:#3987e5; --hist:#7f8a83; --band:#27302b;
  --good:#5fcf8f; --good-bg:#183526; --warn:#f0b04a; --warn-bg:#3a2d12; --bad:#f07b79; --bad-bg:#3d1c1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1a1f1c; --panel-2:#232a26; --line:#313a35; --ink:#eef2ee; --ink-2:#b7c0b9; --ink-3:#8a948d;
  --accent:#5cc49c; --accent-ink:#0d1a14; --accent-soft:#1f3a2f;
  --s1:#3987e5; --hist:#7f8a83; --band:#27302b;
  --good:#5fcf8f; --good-bg:#183526; --warn:#f0b04a; --warn-bg:#3a2d12; --bad:#f07b79; --bad-bg:#3d1c1c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
h2{font-size:16px;font-weight:700}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand-l{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
.pickers{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,button{font:inherit;color:inherit}
select,input[type=text],input[type=date],input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-height:34px}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px 9px;font-family:var(--f-display);font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;min-height:34px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* Sections */
section.view{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.flock-head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.flock-head h2{font-size:22px;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--ink-2)}
.meta b{font-weight:600;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--panel-2);color:var(--ink-2)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lab{font-size:12px;color:var(--ink-2);font-weight:500}
.kpi .val{font-family:var(--f-num);font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.kpi .val small{font-size:12px;color:var(--ink-3);margin-left:3px}
.kpi .sub{font-size:12px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:14px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.band{height:10px;border-radius:2px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-num);font-size:11px;fill:var(--ink-3)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 9px;border-radius:6px;font-size:12px;line-height:1.35;white-space:nowrap;z-index:5;transform:translate(-50%,-100%);margin-top:-8px}
.tip b{font-weight:600}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-family:var(--f-display);font-weight:600;font-size:12px;color:var(--ink-2);background:var(--panel-2);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit}
td:first-child{background:var(--panel);font-weight:600}
tbody tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-num)}
tr.total td{font-weight:600;background:var(--panel-2)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
tr.sel td{background:var(--accent-soft)}
.up{color:var(--good)} .dn{color:var(--bad)} .wn{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.cap-grid input{width:100%;min-width:84px;text-align:right;font-family:var(--f-num)}
.cap-grid td{padding:5px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.note{font-size:12.5px;color:var(--ink-2);max-width:72ch}
.banner{border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--ink-2)}
.banner.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:500;z-index:50}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:6px;background:var(--panel-2);cursor:pointer}
.alert:hover{outline:1px solid var(--ink-3)}
.alert .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-3)}
.alert.bad .dot{background:var(--bad)} .alert.warn .dot{background:var(--warn)} .alert.good .dot{background:var(--good)}
.alert .lvl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.alert.bad .lvl{color:var(--bad)} .alert.warn .lvl{color:var(--warn)} .alert.info .lvl{color:var(--ink-2)}
.alert .who{font-size:12px;color:var(--ink-3);white-space:nowrap}
.alert .txt{min-width:0}
@media (max-width:640px){.alert{grid-template-columns:auto 1fr}.alert .who{grid-column:2;white-space:normal}}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.act{cursor:pointer}
.act:hover{border-color:var(--ink-3)}
.prog{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.mini div{display:flex;flex-direction:column;gap:1px;min-width:0}
.mini span{font-size:11.5px;color:var(--ink-3)}
.mini b{font-family:var(--f-num);font-weight:500;font-size:15px}
.mini em{font-style:normal;font-size:11.5px}
td.spark{padding:2px 10px}
td.spark svg{display:block}
.sec{font-family:var(--f-display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);background:var(--panel)!important;text-align:left!important;padding-top:12px}
.glossary{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 18px;font-size:12.5px;color:var(--ink-2)}
.glossary b{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:no-preference){.tab,.chip,.btn{transition:background .15s,border-color .15s,color .15s}}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.grid3{grid-template-columns:1fr}}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid4{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:13px}
.kv span{color:var(--ink-2)}
.kv b{font-family:var(--f-num);font-weight:500;text-align:right}
.kv .hr{grid-column:1/-1;border-top:1px solid var(--line);margin:3px 0}
.kv .strong{color:var(--ink);font-weight:600}
.hbar{display:grid;grid-template-columns:minmax(110px,170px) 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px}
.hbar .bar{height:10px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.hbar .bar i{display:block;height:100%;background:var(--s1);border-radius:3px}
.hbar b{font-family:var(--f-num);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 11px;cursor:pointer;font-size:13px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.kpi.big .val{font-size:26px}
.delta{font-family:var(--f-num);font-size:12px}
.yr-now{background:var(--accent-soft)!important}
.src{font-size:11.5px;color:var(--ink-3)}
.close-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.close-form input{text-align:right;font-family:var(--f-num)}
.grid2.eq{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:860px){.grid2.eq{grid-template-columns:1fr}}
a{color:var(--accent)}
.drop{cursor:pointer;border-style:dashed;border-width:2px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
details summary{cursor:pointer;padding:6px 0}
.obs{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:9px;max-width:95ch;line-height:1.5}
.obs b{font-family:var(--f-display)}
.sim-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.userbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.userbar .who-me{display:flex;flex-direction:column;line-height:1.15;text-align:right}
.userbar .who-me small{color:var(--ink-3);font-size:11.5px}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="brand-l">
        <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-5h6v5"/></svg></div>
        <div><h1>Control de Galeras</h1><div class="muted" style="font-size:12px" id="syncState">Conectando…</div></div>
      </div>
      <div class="pickers">
        <select id="farmSel" aria-label="Granja"></select>
        <select id="flockSel" aria-label="Parvada"></select>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="panel" aria-selected="true">Panel</button>
      <button class="tab" role="tab" data-tab="anual" aria-selected="false">Resultados anuales</button>
      <button class="tab" role="tab" data-tab="flujo" aria-selected="false">Flujo mensual</button>
      <button class="tab" role="tab" data-tab="reporte" aria-selected="false">Reporte de parvada</button>
      <button class="tab" role="tab" data-tab="semanal" aria-selected="false">Reporte semanal</button>
      <button class="tab" role="tab" data-tab="comparativo" aria-selected="false">Comparativo</button>
      <button class="tab" role="tab" data-tab="costos" aria-selected="false">Costos</button>
      <button class="tab" role="tab" data-tab="pagos" aria-selected="false">Pagos</button>
      <button class="tab" role="tab" data-tab="apendice" aria-selected="false">Apéndice</button>
      <button class="tab" role="tab" data-tab="importar" aria-selected="false">Importar Excel</button>

</header>

<main class="wrap">
  <section class="view" id="v-panel"></section>
  <section class="view" id="v-anual" hidden></section>
  <section class="view" id="v-flujo" hidden></section>
  <section class="view" id="v-reporte" hidden></section>
  <section class="view" id="v-semanal" hidden></section>
  <section class="view" id="v-comparativo" hidden></section>
  <section class="view" id="v-costos" hidden></section>
  <section class="view" id="v-pagos" hidden></section>
  <section class="view" id="v-apendice" hidden></section>
  <section class="view" id="v-importar" hidden></section>
  <section class="view" id="v-captura" hidden></section>
</main>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
"use strict";
/* Cada granja numera sus parvadas corrido (P1, P2…). Un año Cargill = 7 parvadas.
   Pío Pío: el Año 1 tuvo solo 2 parvadas (P1–P2); desde el Año 2 son 7 por año. */
const FARMS=[
  {id:"SI",name:"Avícola San Isidro",y0:2021,cycOf:n=>Math.floor((n-1)/7)+1,cycStart:c=>(c-1)*7+1,note:""},
  {id:"PP",name:"Granja Pío Pío",y0:2023,cycOf:n=>n<=2?1:Math.floor((n-3)/7)+2,cycStart:c=>c<=1?1:3+(c-2)*7,note:" (el Año 1 tuvo solo 2 parvadas)"}];
const FC=id=>FARMS.find(x=>x.id===id)||FARMS[0];
const cycOf=(n,farm)=>FC(farm||S.farm).cycOf(n);
const cycStart=(c,farm)=>FC(farm||S.farm).cycStart(c);
const G=10, WEEKS=7, LB2KG=0.45359237, QQ=100, M2=2916; /* galera 162 × 18 m */
/* Tabla de pago Cargill 2025 */
const PAY={mejora:0.0086,inv:0.012,
  base:[[0,4.49,0.042],[4.5,5.35,0.041],[5.36,5.45,0.0416],[5.46,5.55,0.0422],[5.56,5.65,0.0428],[5.66,12,0.0434]],
  fcr:{"1.70":-0.0095,"1.69":-0.0085,"1.68":-0.0076,"1.67":-0.0066,"1.66":-0.0057,"1.65":-0.0047,"1.64":-0.0038,"1.63":-0.0028,"1.62":-0.0019,"1.61":-0.0009,"1.60":0,"1.59":0.0101,"1.58":0.011,"1.57":0.0119,"1.56":0.0128,"1.55":0.0137,"1.54":0.0146,"1.53":0.0155,"1.52":0.0164,"1.51":0.0173,"1.50":0.0182,"1.49":0.0191,"1.48":0.02,"1.47":0.0209,"1.46":0.0218,"1.45":0.0227,"1.44":0.0236,"1.43":0.0245,"1.42":0.0254,"1.41":0.0227}};
function pay(w,fcr){
  if(!(w>0)||!(fcr>0))return null;
  const b=PAY.base.find(r=>w>=r[0]&&w<=r[1]+0.0099)||PAY.base[PAY.base.length-1];
  let k=Math.round(fcr*100)/100;k=Math.min(1.70,Math.max(1.41,k));
  const bf=PAY.fcr[k.toFixed(2)]??0;
  return {base:b[2],mejora:PAY.mejora,inv:PAY.inv,bfcr:bf,total:b[2]+PAY.mejora+PAY.inv+bf,fcrKey:k};
}
const $=s=>document.querySelector(s);
const S={flocks:new Map(),years:new Map(),pay:new Map(),cash:new Map(),cashPer:null,imp:null,costCyc:null,pf:null,delPay:null,farm:"SI",sel:null,tab:"panel",gWeek:null,capMode:1,chartMetric:"wFinal",db:null,dl:null,loaded:false,readonly:false,draft:null,confirmDel:false,sim:null,panelChart:"margin"};
try{const t=localStorage.getItem("cg.tab");if(t)S.tab=t;const f=localStorage.getItem("cg.farm");if(f&&FARMS.some(x=>x.id===f))S.farm=f;}catch(e){}

/* ---------- utilidades ---------- */
const ok=v=>v!==null&&v!==undefined&&v!==""&&!isNaN(v);
const vals=a=>(a||[]).filter(ok).map(Number);
const mean=a=>{const v=vals(a);return v.length?v.reduce((x,y)=>x+y,0)/v.length:null};
const sum=a=>{const v=vals(a);return v.length?v.reduce((x,y)=>x+y,0):null};
const sd=a=>{const v=vals(a);if(v.length<2)return null;const m=mean(v);return Math.sqrt(v.reduce((s,x)=>s+(x-m)**2,0)/(v.length-1))};
const first=(...a)=>{for(const v of a)if(ok(v))return +v;return null};
const fx=(v,d=2)=>ok(v)?Number(v).toLocaleString("es-NI",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const fi=v=>ok(v)?Math.round(v).toLocaleString("es-NI"):"—";
const pct=(v,d=2)=>ok(v)?fx(v,d)+"%":"—";
const usd=(v,d=0)=>ok(v)?(v<0?"−":"")+"$"+fx(Math.abs(v),d):"—";
const usdk=v=>ok(v)?(Math.abs(v)>=1e6?usd(v/1e6,2)+" mill.":Math.abs(v)>=1e4?usd(v/1e3,0)+" mil":usd(v,0)):"—";

    if(ok(fW)){cumF+=fW;anyF=true}

  const closed=ok(C.lbs)||ok(C.fcr)||ok(hAge)||ok(leftT)||(f.harvest&&f.harvest<todayStr()&&withW.length>=6);

function niceStep(range,count){const raw=range/count;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function scaleY(lo,hi,count=5){if(hi===lo){hi=lo+1}const st=niceStep(hi-lo,count);const a=Math.floor(lo/st)*st,b=Math.ceil(hi/st)*st;const t=[];for(let v=a;v<=b+st/2;v+=st)t.push(+v.toFixed(8));return {lo:a,hi:b,t,st}}
function tipBox(box){let tip=box.querySelector(".tip");if(!tip){tip=document.createElement("div");tip.className="tip";tip.hidden=true;box.appendChild(tip)}return tip}
function attachTip(box,svg,W,xs,render){
  const tip=tipBox(box);const guide=svg.querySelector(".guide");
  function move(ev){
    const r=svg.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width*W;
    let bi=0,bd=1e9;xs.forEach((v,i)=>{const d=Math.abs(v-x);if(d<bd){bd=d;bi=i}});
    const html=render(bi);if(!html){tip.hidden=true;if(guide)guide.setAttribute("opacity",0);return}
    tip.innerHTML=html;tip.hidden=false;const px=xs[bi]/W*r.width;
    tip.style.left=Math.min(Math.max(px,80),r.width-80)+"px";tip.style.top=(ev.clientY-r.top)+"px";
    if(guide){guide.setAttribute("x1",xs[bi]);guide.setAttribute("x2",xs[bi]);guide.setAttribute("opacity",1)}

  svg.addEventListener("pointerleave",()=>{tip.hidden=true;if(guide)guide.setAttribute("opacity",0)});

/* curva por día: serie propia + promedio histórico + banda */
function curveChart(box,{pts,hist,band,d,unit,aria,tip,xs}){
  const W=400,H=260,m={l:42,r:14,t:14,b:28};const iw=W-m.l-m.r,ih=H-m.t-m.b;
  const all=[...pts.map(p=>p.v),...hist.map(p=>p.v),...band.map(p=>p.hi)].filter(ok);
  const sc=scaleY(0,Math.max(...all,0.0001)*1.05,5);

  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">`;
  sc.t.forEach(v=>{s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${fx(v,d)}</text>`});
  xs.forEach(x=>{s+=`<text x="${X(x.day)}" y="${H-8}" text-anchor="middle">${x.lab}</text>`});
  const bb=band.filter(p=>ok(p.lo)&&ok(p.hi));

  const hh=hist.filter(p=>ok(p.v));if(hh.length>1)s+=`<path d="M${hh.map(p=>X(p.day)+","+Y(p.v)).join("L")}" fill="none" stroke="var(--hist)" stroke-width="2" stroke-dasharray="5 4"/>`;

    pp.forEach((p,i)=>{s+=`<circle cx="${X(p.day)}" cy="${Y(p.v)}" r="${i===pp.length-1?5:3.5}" fill="var(--s1)" stroke="var(--panel)" stroke-width="2"/>`});
    const lp=pp[pp.length-1];const right=lp.day>30;s+=`<text x="${X(lp.day)+(right?-9:9)}" y="${Y(lp.v)-9}" text-anchor="${right?"end":"start"}" style="fill:var(--ink);font-weight:500">${fx(lp.v,d)}${unit}</text>`}
  s+=`<line class="guide" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--ink-3)" opacity="0"/><line x1="${m.l}" x2="${W-m.r}" y1="${m.t+ih}" y2="${m.t+ih}" stroke="var(--ink-3)"/></svg>`;

}

        Object.entries(yc).forEach(([y,c])=>{const o={cycle:+y,label:String(cell(g,st-1,c)??"")};for(let r=st+1;r<g.length;r++){const lab=[0,1].map(c=>cell(g,r,c)).filter(v=>typeof v==="string").map(norm).find(Boolean)||"";const mp=MAP.find(m=>m[0].test(lab));if(mp&&isNum(cell(g,r,c)))o[mp[1]]=rnd(cell(g,r,c),mp[1]==="roi"?4:2)}
          if(Object.keys(o).length>3)out.years[y]=o});}}
    // --- detalle de pagos
    const shP=findSheet(wb,/detalle de pago/);

      if(hr>=0){const H={};g[hr].forEach((v,c)=>{const n=norm(v);if(n)H[n]=c});const col=k=>H[k];
        let n=0,skip=0;
        for(let r=hr+1;r<g.length;r++){const row=g[r]||[];const d=serialToISO(row[col("fecha")]);const cat=row[col("categoria")];
          const usdv=row[col("dolarizado")],tot=row[col("total")];
          if(!d||!cat||norm(cat)==="mmm"||(!isNum(usdv)&&!isNum(tot))){if(row.some(v=>v!==null&&v!==0&&!(isNum(v)&&v>30&&v<40)))skip++;continue}
          let p=row[col("#p")];p=isNum(p)?"P"+p:(p?String(p).trim():"");{const mm=/^p\s*v?\s*(\d+)$/i.exec(p);if(mm)p="P"+(+mm[1])}
          const k0=bank(row[col("banco")]);const o={d,c:CAT[norm(cat)]||String(cat).trim().replace(/^./,x=>x.toUpperCase()),p,m:(x=>({TRF:"TF",CHEQUE:"CK",EFE:"EF"}[x]||x))(String(row[col("pagado")]||row[col("forma de pago")]||"").trim().toUpperCase()),b:String(row[col("beneficiario")]||"").trim(),
            t:String(row[col("concepto")]||"").replace(/\s+/g," ").trim(),k:k0,s:rnd(row[col("subtotal")],2),r2:rnd(row[col("2%")],2)||null,r1:rnd(row[col("1%")],2)||null,iva:rnd(row[col("iva")],2)||null,tot:rnd(tot,2),tc:rnd(row[col("tco")],4),usd:rnd(usdv,2)};
          if(/C\$$/.test(o.k)&&isNum(o.tot)&&isNum(o.usd)&&Math.abs(o.tot-o.usd)<0.01)o.k=o.k.replace("C$","$");
          Object.keys(o).forEach(x=>{if(o[x]===null||o[x]===""||o[x]===undefined)delete o[x]});
          (out.payments[d.slice(0,7)]=out.payments[d.slice(0,7)]||[]).push(o);n++;}
        Object.values(out.payments).forEach(a=>a.sort((x,y)=>x.d.localeCompare(y.d)));
        if(skip)warn.push(`${skip} filas del detalle de pagos no tenían fecha, categoría o monto y no se importaron.`);
      } else warn.push("No encontré los encabezados del “Detalle de pago”.");}

})();

function dataIssues(c){
  const out=[];
  c.weeks.forEach(r=>{if(!ok(r.w))return;r.wg.forEach((v,g)=>{if(ok(v)&&(v<r.w*0.6||v>r.w*1.4))out.push(`${r.n?"S"+r.n:"Recepción"} G${g+1}: peso ${fx(v,3)} lb (promedio ${fx(r.w,3)})`)})});
  for(let n=2;n<WEEKS;n++)for(let g=0;g<G;g++){const a=c.weeks[n].mg[g],b=c.weeks[n-1].mg[g];if(ok(a)&&ok(b)&&a<b-0.3)out.push(`S${n} G${g+1}: mortalidad acumulada baja de ${fx(b,2)}% a ${fx(a,2)}%`)}
  return out;
}
function alertsFor(){
  const out=[];const T=todayStr();
  [...S.flocks.values()].map(C_).filter(c=>!c.closed).forEach(c=>{
    const f=c.f,h=hist(f.farm,f._id),L=c.last,who=`${flockName(f)} · ${farmName(f.farm)}`;
    if(L&&L.n>0){const d=diffPct(L.w,h.wk[L.n].w);
      if(ok(d)&&d<-5)out.push({lvl:"bad",who,id:f._id,t:`Peso de semana ${L.n} ${fx(Math.abs(d),1)}% abajo del histórico (${fx(L.w,2)} vs ${fx(h.wk[L.n].w,2)} lb)`});
      else if(ok(d)&&d<-2)out.push({lvl:"warn",who,id:f._id,t:`Peso de semana ${L.n} ${fx(Math.abs(d),1)}% abajo del histórico`});
      else if(ok(d)&&d>3)out.push({lvl:"good",who,id:f._id,t:`Peso de semana ${L.n} va ${fx(d,1)}% arriba del histórico`});
      const low=L.wg.map((v,i)=>({v,i})).filter(o=>ok(o.v)&&o.v<L.w*0.95).map(o=>"G"+(o.i+1));
      if(low.length)out.push({lvl:"warn",who,id:f._id,t:`Galeras con peso rezagado en semana ${L.n}: ${low.join(", ")}`});
      if(ok(L.cv)&&L.cv>8)out.push({lvl:"warn",who,id:f._id,t:`Peso disparejo entre galeras: variación de ${fx(L.cv,1)}%`});}
    const M=c.lastM;
    if(M){const hm=h.wk[M.n].mortCum;const d=ok(hm)?M.mortCum-hm:null;
      if(ok(d)&&d>0.75)out.push({lvl:d>1.5?"bad":"warn",who,id:f._id,t:`Mortalidad acumulada a semana ${M.n}: ${pct(M.mortCum)} (histórico ${pct(hm)} a esa edad)`});
      if(ok(M.mortW)&&M.mortW>1.2&&M.n>1)out.push({lvl:M.mortW>2?"bad":"warn",who,id:f._id,t:`Mortalidad de la semana ${M.n}: ${pct(M.mortW)}`});
      const hiG=M.mg.map((v,i)=>({v,i})).filter(o=>ok(o.v)&&o.v>M.mortCum+1.5).map(o=>`G${o.i+1} (${fx(o.v,2)}%)`);
      if(hiG.length)out.push({lvl:"warn",who,id:f._id,t:`Galeras con mortalidad alta en semana ${M.n}: ${hiG.join(", ")}`});}
    for(let n=1;n<WEEKS;n++){if(ok(c.dayNow)&&c.dayNow>=n*7+2&&!ok(c.weeks[n].w)&&(!f.harvest||days(f.start,f.harvest)>=n*7)){out.push({lvl:"info",who,id:f._id,t:`Falta capturar el pesaje de la semana ${n} (día ${n*7})`});break}}
    const miss=c.weeks.slice(1).filter(r=>ok(r.w)).flatMap(r=>r.wg.map((v,i)=>ok(v)?null:`S${r.n}·G${i+1}`).filter(Boolean));
    if(miss.length&&miss.length<=6)out.push({lvl:"info",who,id:f._id,t:`Datos incompletos: ${miss.join(", ")}`});
    if(f.harvest){const dl=days(T,f.harvest);if(dl>=0&&dl<=7)out.push({lvl:"info",who,id:f._id,t:`Cosecha programada en ${dl} días (${fd(f.harvest)})`})}
  });
  FARMS.flatMap(fm=>{const cs=farmFlocks(fm.id).map(C_);const cl=cs.filter(c=>c.closed);return [...cs.filter(c=>!c.closed),...cl.slice(-1)]}).forEach(c=>{const iss=dataIssues(c);if(iss.length)out.push({lvl:"info",who:`${flockName(c.f)} · ${farmName(c.f.farm)}`,id:c.f._id,t:`Revisar posible error de captura: ${iss.slice(0,2).join("; ")}${iss.length>2?` y ${iss.length-2} más`:""}`})});
  FARMS.forEach(fm=>{const cs=farmFlocks(fm.id).map(C_).filter(c=>c.closed);if(cs.length<3)return;const c=cs[cs.length-1];const h=hist(fm.id,c.f._id);const who=`${flockName(c.f)} · ${fm.name}`;
    const d=diffPct(c.wFinal,h.wFinal);if(ok(d)&&d<-4)out.push({lvl:"warn",who,id:c.f._id,t:`Última parvada cerró con peso ${fx(Math.abs(d),1)}% abajo del promedio (${fx(c.wFinal,2)} lb)`});
    if(ok(c.mort)&&ok(h.mort)&&c.mort-h.mort>1)out.push({lvl:"warn",who,id:c.f._id,t:`Última parvada cerró con mortalidad ${pct(c.mort)} (promedio ${pct(h.mort)})`});
    if(ok(c.marginLb)&&ok(h.marginLb)&&diffPct(c.marginLb,h.marginLb)<-15)out.push({lvl:"warn",who,id:c.f._id,t:`Margen por libra de la última parvada ${usd(c.marginLb,4)} vs promedio ${usd(h.marginLb,4)}`});
    if(ok(c.costLb)&&ok(h.costLb)&&diffPct(c.costLb,h.costLb)>10)out.push({lvl:"warn",who,id:c.f._id,t:`Costo por libra de la última parvada ${usd(c.costLb,4)}, ${fx(diffPct(c.costLb,h.costLb),0)}% arriba del promedio`});
    if(!ok(c.C.liq)&&ok(c.liq))out.push({lvl:"info",who,id:c.f._id,t:`Falta registrar la liquidación real de Cargill (se usa ${c.liqSrc})`});
  });
  const ord={bad:0,warn:1,info:2,good:3};return out.sort((a,b)=>ord[a.lvl]-ord[b.lvl]);
}

function spark(vals,d){
  const W=132,H=30,p=4;const pts=vals.map((v,i)=>({v,i})).filter(o=>ok(o.v));
  if(pts.length<2)return '<span class="muted">—</span>';
  const vs=pts.map(o=>o.v);const mn=Math.min(...vs),mx=Math.max(...vs);const rg=mx-mn||1;
  const X=i=>p+i/(vals.length-1)*(W-2*p),Y=v=>H-p-(v-mn)/rg*(H-2*p);const av=mean(vs);const last=pts[pts.length-1];
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tendencia"><line x1="${p}" x2="${W-p}" y1="${Y(av)}" y2="${Y(av)}" stroke="var(--line)" stroke-dasharray="3 3"/><path d="M${pts.map(o=>X(o.i)+","+Y(o.v)).join("L")}" fill="none" stroke="var(--s1)" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${X(last.i)}" cy="${Y(last.v)}" r="3" fill="var(--s1)"/></svg>`;
}

  if(Math.abs(d)<2)return `<span class="pill">En promedio</span>`;return good?`<span class="pill good">Mejor</span>`:Math.abs(d)>6?`<span class="pill bad">Peor</span>`:`<span class="pill warn">Vigilar</span>`}
function indicatorTable(farm){

  ${IND.map(it=>{if(it.sec)return `<tr><td class="sec" colspan="8">${it.sec}</td></tr>`;
    const vs=cs.map(it.get);const good=cs.map((c,i)=>({c,v:vs[i]})).filter(o=>ok(o.v));
    if(!good.length)return `<tr><td>${it.lab}</td><td class="muted" colspan="7" style="text-align:left">Sin datos todavía</td></tr>`;
    const srt=good.slice().sort((a,b)=>it.hb?b.v-a.v:a.v-b.v);const best=srt[0],worst=srt[srt.length-1];const av=mean(vs);const lv=it.get(L);
    const F=v=>it.usd?usd(v,it.d):it.d===0?fi(v):fx(v,it.d);
    return `<tr><td>${it.lab}</td><td class="num">${F(lv)}</td><td class="num">${F(mean(l7.map(it.get)))}</td><td class="num">${F(av)}</td><td class="num">${F(best.v)} <span class="muted">P${best.c.f.num}</span></td><td class="num">${F(worst.v)} <span class="muted">P${worst.c.f.num}</span></td><td class="spark">${spark(tr.map(it.get))}</td><td>${ok(lv)?diffTag(lv,av,it.hb)+" "+statusOf(lv,av,it.hb):"—"}</td></tr>`}).join("")}
  </tbody></table></div></div>`;
}

  }

function galeraHistory(cs){
  const closed=cs.filter(c=>c.closed);if(!closed.length)return "";
  const rows=[];
  for(let g=0;g<G;g++){
    const rel=closed.map(c=>{const v=c.weeks[5].wg[g],a=c.weeks[5].w;return ok(v)&&ok(a)?(v-a)/a*100:null}).filter(ok);
    const mrel=closed.map(c=>{const v=c.weeks[6].mg[g],a=c.weeks[6].mortCum;return ok(v)&&ok(a)?v-a:null}).filter(ok);
    rows.push({g,w5:mean(closed.map(c=>c.weeks[5].wg[g])),rel:mean(rel),m6:mean(closed.map(c=>c.weeks[6].mg[g])),mrel:mean(mrel),age:mean(closed.map(c=>c.f.hAge[g])),left:mean(closed.map(c=>c.f.left[g])),beat:rel.filter(x=>x>0).length,n:rel.length});
  }
  const sorted=rows.slice().sort((a,b)=>(b.rel??-99)-(a.rel??-99));
  return `<div class="card"><h3>Desempeño histórico por galera</h3><p class="note">Cada galera comparada contra el promedio de su propia parvada, a lo largo de ${closed.length} parvadas cerradas. Sirve para detectar galeras con problemas de equipo, ventilación o densidad.</p><div class="scroll"><table><thead><tr><th>Galera</th><th>Peso S5 prom</th><th>Peso vs su parvada</th><th>Veces arriba</th><th>Mort. acum S6</th><th>Mort. vs su parvada</th><th>Edad cosecha</th><th>Quedados prom</th></tr></thead><tbody>
  ${sorted.map((r,i)=>`<tr><td>G${r.g+1} ${i===0?'<span class="pill good">Mejor</span>':i===sorted.length-1?'<span class="pill warn">Más baja</span>':""}</td><td class="num">${fx(r.w5,2)}</td><td class="num ${ok(r.rel)?(r.rel>1?"up":r.rel<-1?"dn":""):""}">${ok(r.rel)?(r.rel>=0?"+":"")+fx(r.rel,1)+"%":"—"}</td><td class="num">${r.beat} de ${r.n}</td><td class="num">${pct(r.m6)}</td><td class="num ${ok(r.mrel)?(r.mrel>0.3?"dn":r.mrel<-0.3?"up":""):""}">${ok(r.mrel)?(r.mrel>=0?"+":"")+fx(r.mrel,2)+" puntos":"—"}</td><td class="num">${fx(r.age,1)}</td><td class="num">${fi(r.left)}</td></tr>`).join("")}
  </tbody></table></div></div>`;
}

const METODO={EF:"Efectivo",TC:"Tarjeta",TF:"Transferencia",CK:"Cheque"};
function allPayments(farm){
  const out=[];[...S.pay.values()].filter(d=>d.farm===farm).forEach(d=>(d.rows||[]).forEach((r,i)=>out.push(Object.assign({_doc:d._id,_i:i},r))));
  return out.sort((a,b)=>b.d.localeCompare(a.d));
}
const pNum=p=>{const m=/^P(\d+)$/.exec(p||"");return m?+m[1]:null};
function payCycle(r){const n=pNum(r.p);if(n){const f=S.flocks.get(S.farm+"-"+String(n).padStart(2,"0"));if(f&&ok(f.cycle))return f.cycle;return cycOf(n)}return null}
function renderPagos(){
  const el=$("#v-pagos");const farm=S.farm;const rows=allPayments(farm);
  if(!S.pf)S.pf={q:"",cyc:"",p:"",c:"",k:"",m:"",from:"",to:"",lim:150};

   <label class="field">Desde<input type="date" id="pfFrom" value="${esc(F.from)}"></label><label class="field">Hasta<input type="date" id="pfTo" value="${esc(F.to)}"></label>

  </div></div>
  <div class="kpis">

   ${kpi("Categoría principal",byC.length?esc(byC[0][0]):"—","",byC.length&&tot?`${usd(byC[0][1])} · ${fx(byC[0][1]/tot*100,0)}%`:"")}
   ${kpi("Beneficiario principal",byB.length?esc(byB[0][0]):"—","",byB.length&&tot?`${usd(byB[0][1])} · ${fx(byB[0][1]/tot*100,0)}%`:"")}

   <div class="card"><h3>Principales beneficiarios</h3><div class="hbar">${byB.slice(0,12).map(([k,v])=>`<span>${esc(k)}</span><span class="bar"><i style="width:${v/mb*100}%"></i></span><b>${usd(v)}</b>`).join("")}</div></div>

  ${fr.slice(0,F.lim).map(r=>`<tr><td>${fdShort(r.d)}</td><td>${esc(r.p||"")}</td><td style="text-align:left">${esc(r.c)}</td><td style="text-align:left;white-space:normal;min-width:160px">${esc(r.b)}</td><td style="text-align:left;white-space:normal;min-width:260px">${esc(r.t)}</td><td>${esc(r.k||"")}</td><td>${esc(METODO[r.m]||r.m||"")}</td><td class="num">${fx(r.s,2)}</td><td class="num">${fx(r.r2,2)}</td><td class="num">${fx(r.r1,2)}</td><td class="num">${fx(r.iva,2)}</td><td class="num">${fx(r.tot,2)}</td><td class="num">${fx(r.tc,4)}</td><td class="num" style="font-weight:600">${fx(r.usd,2)}</td><td>${S.delPay===r._doc+":"+r._i?`<button class="btn danger" data-delyes="${r._doc}:${r._i}">Eliminar</button>`:`<button class="btn" data-del="${r._doc}:${r._i}" aria-label="Eliminar pago" ${S.readonly||!S.db?"disabled":""}>×</button>`}</td></tr>`).join("")}
  </tbody></table></div>${fr.length>F.lim?`<div class="row" style="justify-content:center"><button class="btn" id="pgMore">Mostrar 150 más</button></div>`:""}
  <p class="src">Montos en la moneda del banco (C$ o $). La columna US$ es el monto en dólares con el tipo de cambio de la fila. Forma de pago: EF efectivo, TC tarjeta, TF transferencia, CK cheque.</p></div>
  ${payForm(farm,rows)}`;
  el.innerHTML=html;
  const byP={};fr.forEach(r=>{if(pNum(r.p)){byP[r.p]=(byP[r.p]||0)+(r.usd||0)}});
  const pk=Object.keys(byP).sort((a,b)=>pNum(a)-pNum(b));
  barChart($("#pgP"),pk.map(p=>({key:p,lab:p,v:byP[p]})),{fmt:usdk,aria:"Pagos por parvada",avg:mean(pk.map(p=>byP[p])),zero:true,tip:it=>`<b>${it.lab}</b><br>${usd(it.v)}`,onClick:it=>{S.pf.p=it.key;renderPagos()}});
  const upd=()=>{Object.assign(F,{q:$("#pfQ").value,cyc:$("#pfCyc").value,p:$("#pfP").value,c:$("#pfC").value,k:$("#pfK").value,m:$("#pfM").value,from:$("#pfFrom").value,to:$("#pfTo").value,lim:150});renderPagos()};

  let tq;$("#pfQ").addEventListener("input",()=>{clearTimeout(tq);tq=setTimeout(()=>{upd();const i=$("#pfQ");i.focus();i.setSelectionRange(i.value.length,i.value.length)},350)});

  bindPayForm(farm);
}
function payForm(farm,rows){

  <datalist id="dlCat">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist><datalist id="dlBen">${bens.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>

   <label class="field">Subtotal<input type="number" step="0.01" id="npS"></label>

   <label class="field">IVA<input type="number" step="0.01" id="npI"></label>

function bindPayForm(farm){
  const b=$("#npSave");if(!b)return;
  const calcP=()=>{const s=+$("#npS").value||0,r2=+$("#npR2").value||0,r1=+$("#npR1").value||0,iv=+$("#npI").value||0,tc=+$("#npT").value||0;const tot=s-r2-r1+iv;const k=$("#npK").value;const usdv=/\$$/.test(k)&&!/C\$$/.test(k)?tot:(tc?tot/tc:null);
    $("#npCalc").textContent=s?`Total ${fx(tot,2)} · ${usd(usdv,2)} en dólares`:"El total y el monto en dólares se calculan solos.";return {tot,usdv}};
  ["npS","npR2","npR1","npI","npT","npK"].forEach(id=>$("#"+id).addEventListener("input",calcP));
  b.addEventListener("click",async()=>{
    const d=$("#npD").value,s=+$("#npS").value;if(!d||!s||!$("#npB").value.trim()){toast("Escribe fecha, beneficiario y subtotal");return}
    const {tot,usdv}=calcP();const m=d.slice(0,7);const id=farm+"-"+m;
    const row={a:1,d,c:$("#npC").value.trim()||"Gastos varios",p:$("#npP").value.trim().toUpperCase(),m:$("#npM").value,b:$("#npB").value.trim(),t:$("#npTx").value.trim(),k:$("#npK").value,s,tot:+tot.toFixed(2),tc:+$("#npT").value||null,usd:ok(usdv)?+usdv.toFixed(2):null};
    ["r2","r1","iva"].forEach((k,i)=>{const v=+$(["#npR2","#npR1","#npI"][i]).value;if(v)row[k]=v});
    Object.keys(row).forEach(k=>{if(row[k]===null||row[k]==="")delete row[k]});
    const cur=S.pay.get(id);const body=cur?stripId(cur):{farm,month:m,rows:[]};body.rows=[...(body.rows||[]),row].sort((a,b)=>a.d.localeCompare(b.d));
    b.disabled=true;try{await S.db.doc("payments/"+id).set(JSON.parse(JSON.stringify(body)));toast("Pago guardado");S.pf=null}catch(e){toast("No se guardó: "+(e.message||e.code));b.disabled=false}
  });
}

/* ---------- APÉNDICE ---------- */
function renderApendice(){
  const el=$("#v-apendice");const farm=S.farm;const full=lastFullCycle(farm);
  if(!full){el.innerHTML=emptyState();return}
  const A=cycleAgg(farm,full),B=cycleAgg(farm,full-1),F1=cycleAgg(farm,cyclesOf(farm)[0]);
  const obs=observations(farm,A,B,F1);

  const res=(o)=>{const p=pay(o.w,o.fcr);const lbs=o.alive*o.w;const inc=lbs*p.total;return {p,lbs,inc,profit:inc-lbs*base.cost}};
  const B0=res(base);
  const row=(lab,o,note="")=>{const r=res(o);const d=r.inc-B0.inc;return `<tr class="${Math.abs(d)<1?"sel":""}"><td>${lab}</td><td class="num">${usd(r.p.total,4)}</td><td class="num">${lbk(r.lbs)}</td><td class="num">${usd(r.inc)}</td><td class="num ${d>1?"up":d<-1?"dn":""}">${Math.abs(d)<1?"base":(d>0?"+":"")+usd(d)}</td><td class="num ${d>1?"up":d<-1?"dn":""}">${Math.abs(d)<1?"—":(d>0?"+":"")+usd(d*7)}</td><td class="src" style="text-align:left;white-space:normal">${note}</td></tr>`};
  const th=`<thead><tr><th>Escenario</th><th>Precio $/lb</th><th>Libras</th><th>Liquidación</th><th>Diferencia por parvada</th><th>Diferencia por año (7)</th><th style="text-align:left">Qué cambia</th></tr></thead>`;
  const fcrs=[0.06,0.04,0.02,0.01,0,-0.01,-0.02,-0.04,-0.06];
  const ws=[-0.3,-0.2,-0.1,0,0.1,0.2,0.3];
  const ms=[1,0.5,0,-0.5,-1,-1.5];
  const mtxF=[0.04,0.02,0,-0.02,-0.04],mtxW=[-0.2,-0.1,0,0.1,0.2];
  let html=`<div class="flock-head"><h2>Apéndice</h2><span class="muted">${esc(farmName(farm))} · observaciones y ejercicios de dinero</span></div>
  <div class="card"><h3>Observaciones que muestran los números</h3><ol class="obs">${obs.map(o=>`<li><b>${o.t}</b> ${o.d}</li>`).join("")}</ol>
  <p class="src">Se recalculan solas cada vez que agregas o corriges datos.</p></div>
  <div class="card"><h3>Punto de partida de los ejercicios</h3><p class="note">Una parvada promedio de ${cycLabel(full)} (${cycYears(full)}), pagada con la tabla Cargill 2025. Cargill pone el alimento y el pollito: a ti te pagan por libra producida, y la conversión solo cambia el bono que recibes.</p>
   <div class="sim-out">${kpi("Aves vivas a cosecha",fi(base.alive),"",`de ${fi(base.birds)} recibidas`)}${kpi("Peso a cosecha",fx(base.w,2),"lb","")}${kpi("Conversión",fx(base.fcr,3),"","")}${kpi("Precio tabla 2025",usd(B0.p.total,4),"/lb",`base ${usd(B0.p.base,4)} + bono por conversión ${usd(B0.p.bfcr,4)} + otros ${usd(B0.p.mejora+B0.p.inv,4)}`)}${kpi("Liquidación por parvada",usdk(B0.inc),"",`${lbk(B0.lbs)} lb`)}${kpi("Químicos Cargill por parvada",usd(base.hab),"",`ya incluidos en el costo · promedio de ${cycLabel(full)}`)}${kpi("Costo operativo",usd(base.cost,4),"/lb",`utilidad ${usdk(B0.profit)} por parvada`)}</div></div>
  <div class="card"><h3>Ejercicio 1 · Mejorar la conversión alimenticia</h3><div class="scroll"><table>${th}<tbody>
   ${fcrs.map(d=>row(d===0?`Conversión ${fx(base.fcr,3)} (hoy)`:`Conversión ${fx(base.fcr+d,3)} (${d>0?"+":""}${fx(d,2)})`,{...base,fcr:base.fcr+d},d===0?"":`Bono por conversión ${usd(pay(base.w,base.fcr+d).bfcr,4)}/lb`)).join("")}
  </tbody></table></div><p class="note">Cada 0.01 de conversión cambia el bono en unos ${usd(Math.abs(pay(base.w,base.fcr-0.01).total-B0.p.total),4)} por libra: <b>${usd(Math.abs(res({...base,fcr:base.fcr-0.01}).inc-B0.inc))} por parvada</b>, ${usd(Math.abs(res({...base,fcr:base.fcr-0.01}).inc-B0.inc)*7)} al año. Cuidado con cruzar 1.60: arriba de ese valor el bono pasa a ser descuento.</p></div>
  <div class="card"><h3>Ejercicio 2 · Aumentar el peso a cosecha</h3><div class="scroll"><table>${th}<tbody>
   ${ws.map(d=>row(d===0?`${fx(base.w,2)} lb (hoy)`:`${fx(base.w+d,2)} lb (${d>0?"+":""}${fx(d,1)})`,{...base,w:base.w+d},d===0?"":`Pago base ${usd(pay(base.w+d,base.fcr).base,4)}/lb por rango de peso`)).join("")}
  </tbody></table></div><p class="note">El peso paga dos veces: más libras por pollo y, al pasar de rango, un pago base más alto (${PAY.base.slice(1).map(b=>`${fx(b[0],2)}–${fx(b[1],2)} lb: ${usd(b[2],4)}`).join(" · ")}). Supone la misma conversión; en la práctica más días de engorde también gastan más energía y gas.</p></div>
  <div class="card"><h3>Ejercicio 3 · Bajar la mortalidad</h3><div class="scroll"><table>${th}<tbody>
   ${ms.map(d=>{const m=base.mort+d;const alive=base.alive-base.birds*d/100;return row(d===0?`${pct(base.mort)} (hoy)`:`${pct(m)} (${d>0?"+":""}${fx(d,1)} puntos)`,{...base,alive},d===0?"":`${fi(alive-base.alive)} pollos ${d<0?"más":"menos"} a cosecha`)}).join("")}
  </tbody></table></div><p class="note">Cada punto de mortalidad son unos ${fi(base.birds/100)} pollos por parvada, que equivalen a ${lbk(base.birds/100*base.w)} lb.</p></div>
  <div class="card"><h3>Ejercicio 4 · Conversión y peso juntos</h3><p class="note">Utilidad por parvada: liquidación menos el costo operativo de ${usd(base.cost,4)}/lb (el costo ya incluye unos ${usd(base.hab)} de químicos que descuenta Cargill). La celda marcada es hoy.</p>
  <div class="scroll"><table><thead><tr><th>Conversión \\ Peso</th>${mtxW.map(w=>`<th>${fx(base.w+w,2)} lb</th>`).join("")}</tr></thead><tbody>
  ${mtxF.map(f=>`<tr><td>${fx(base.fcr+f,3)}</td>${mtxW.map(w=>{const r=res({...base,fcr:base.fcr+f,w:base.w+w});const d=r.profit-B0.profit;return `<td class="num ${f===0&&w===0?"yr-now":d>1?"up":d<-1?"dn":""}">${usdk(r.profit)}<br><span class="src">${f===0&&w===0?"hoy":(d>0?"+":"")+usdk(d)}</span></td>`}).join("")}</tr>`).join("")}
  </tbody></table></div></div>
  <div class="card"><h3>Ejercicio 5 · Bajar el costo operativo</h3><div class="scroll"><table><thead><tr><th>Escenario</th><th>Costo $/lb</th><th>Ahorro por parvada</th><th>Ahorro por año (7)</th></tr></thead><tbody>
  ${[0.001,0.002,0.003].map(x=>`<tr><td>Bajar ${usd(x,3)} por libra</td><td class="num">${usd(base.cost-x,4)}</td><td class="num up">${usd(B0.lbs*x)}</td><td class="num up">${usd(B0.lbs*x*7)}</td></tr>`).join("")}
  ${[0.05,0.1].map(x=>`<tr><td>Bajar ${fx(x*100,0)}% el costo</td><td class="num">${usd(base.cost*(1-x),4)}</td><td class="num up">${usd(B0.lbs*base.cost*x)}</td><td class="num up">${usd(B0.lbs*base.cost*x*7)}</td></tr>`).join("")}
  </tbody></table></div><p class="note">Para comparar: ahorrar ${usd(0.001,3)} por libra vale casi lo mismo que mejorar la conversión en ${fx(0.001/Math.max(1e-6,Math.abs(pay(base.w,base.fcr-0.01).total-B0.p.total))*0.01,3)}.</p></div>`;
  html+=`<div class="card"><h3>Glosario para el equipo</h3><div class="glossary">
   <div><b>Parvada</b>: un lote de pollos desde que llega el pollito (día 1) hasta la cosecha. Un ciclo o año Cargill tiene 7 parvadas.</div>
   <div><b>Ganancia diaria</b>: libras que gana cada pollo por día. Semanal = lo que subió en la semana ÷ 7.</div>
   <div><b>Conversión alimenticia</b>: libras de alimento que se necesitan para producir una libra de pollo. Entre más baja, mejor, y Cargill paga más bono.</div>
   <div><b>Mortalidad acumulada</b>: porcentaje de pollos muertos desde el día 1 hasta esa semana.</div>
   <div><b>Variación entre galeras</b>: qué tan parejo va el peso entre galeras. Menos de 5% es parejo; más de 8% hay galeras rezagadas.</div>
   <div><b>IEP</b>: índice de eficiencia productiva. Junta viabilidad, peso, edad y conversión en un solo número; arriba de 400 es muy bueno.</div>

   <div><b>Pollos quedados</b>: pollos que no se llevaron en la cosecha.</div>
   <div><b>Vaciado sanitario</b>: días que la granja queda vacía entre parvadas para limpieza y desinfección.</div>
   <div><b>Habilitación</b>: preparación de la granja entre parvadas. Cargill descuenta de la liquidación los químicos que usa en ella.</div>
   <div><b>Precio liquidado</b>: lo que Cargill paga por cada libra producida: pago base según el peso, más bonos por conversión, mejora e inversión.</div>
   <div><b>Margen por libra</b>: precio liquidado menos el costo operativo por libra. Es lo que queda por cada libra.</div>
   <div><b>Rentabilidad (ROI)</b>: utilidad del año dividida entre el ingreso total.</div>

  </div></div>`;
  el.innerHTML=html;
}
function observations(farm,A,B,F1){

  const wk=hist(farm,null).wk;if(ok(wk[2].mortCum)&&ok(wk[6].mortCum))o.push({t:"La mortalidad se concentra al inicio.",d:`En promedio ${pct(wk[2].mortCum,1)} de mortalidad ocurre en las primeras 2 semanas, casi ${fx(wk[2].mortCum/wk[6].mortCum*100,0)}% de toda la parvada. Cuidar la recepción y la calefacción en los primeros 14 días es donde más pollos se salvan.`});

  const G_=[];for(let g=0;g<G;g++){const rel=cs.map(c=>{const v=c.weeks[5].wg[g],a=c.weeks[5].w;return ok(v)&&ok(a)?(v-a)/a*100:null}).filter(ok);const mr=cs.map(c=>{const v=c.weeks[6].mg[g],a=c.weeks[6].mortCum;return ok(v)&&ok(a)?v-a:null}).filter(ok);G_.push({g,rel:mean(rel),mr:mean(mr)})}
  const gs=G_.filter(x=>ok(x.rel)).sort((a,b)=>b.rel-a.rel);if(gs.length)o.push({t:"Galeras con diferencia constante.",d:`La G${gs[0].g+1} pesa en promedio ${fx(gs[0].rel,1)}% más que su parvada y la G${gs[gs.length-1].g+1} ${fx(Math.abs(gs[gs.length-1].rel),1)}% menos. ${(x=>x?`La G${x.g+1} tiene ${fx(x.mr,2)} puntos más de mortalidad que el promedio.`:"")(G_.filter(x=>ok(x.mr)).sort((a,b)=>b.mr-a.mr)[0])} Vale revisar equipos, ventilación y bebederos de esas galeras.`});

}

  const months=[...S.cash.values()].filter(d=>d.farm===farm&&d.month).sort((a,b)=>a.month.localeCompare(b.month));

function cashPeriods(months){

function eqv(a,b){
  if(a===b)return true;const na=a===null||a===undefined||a==="",nb=b===null||b===undefined||b==="";if(na||nb)return na&&nb;
  if(typeof a==="number"&&typeof b==="number")return Math.abs(a-b)<=0.011+1e-9*Math.abs(b);
  if(Array.isArray(a)||Array.isArray(b)){if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length)return false;return a.every((x,i)=>eqv(x,b[i]))}

  return false;
}
function flockBase(farm,n){const id=farm+"-"+String(n).padStart(2,"0");const E=S.flocks.get(id);
  const d=E?stripId(norm(JSON.parse(JSON.stringify(E)))):stripId(norm({farm,num:n,cycle:cycOf(n,farm),notes:""}));return {id,E,d}}
function planComparativo(farm,P){
  const plan=[];
  P.flocks.forEach(f=>{const {id,E,d}=flockBase(farm,f.num);const old=JSON.parse(JSON.stringify(d));
    d.farm=farm;d.num=f.num;if(f.start)d.start=f.start;if(f.harvest)d.harvest=f.harvest;
    ["placed","w","mc","fcrW","hAge","left"].forEach(k=>d[k]=f[k]);if(!ok(d.cycle))d.cycle=cycOf(f.num,farm);
    const what=[];if(!E)what.push("nueva");else{
      if(!eqv(old.placed,d.placed))what.push("aves recibidas");
      for(let n=0;n<7;n++){if(!eqv(old.w[n],d.w[n]))what.push(n?`peso S${n}`:"peso de recepción");if(n&&!eqv(old.mc[n],d.mc[n]))what.push(`mortalidad S${n}`);if(n&&!eqv(old.fcrW[n],d.fcrW[n]))what.push(`conversión S${n}`)}
      if(!eqv(old.hAge,d.hAge)||!eqv(old.left,d.left))what.push("cosecha");if(old.start!==d.start||old.harvest!==d.harvest)what.push("fechas")}
    if(!E||what.length)plan.push({col:"flocks",id,body:d,grp:"Parvadas",lab:`Parvada ${f.num}`,what,isNew:!E})});
  return plan;
}

  Object.entries(P.close).forEach(([n,cl])=>{n=+n;const {id,E,d}=flockBase(farm,n);const old=JSON.parse(JSON.stringify(d.close||{}));
    const nc=Object.assign({},old,cl);if(cl.costs)nc.costs=cl.costs;d.close=nc;
    if(!E||!eqv(old,nc)){const what=[];if(!E)what.push("nueva (solo cierre)");else{const ks=Object.keys(nc).filter(k=>!eqv(old[k],nc[k]));

      plan.push({col:"payments",id,body,grp:"Detalle de pagos",lab:mLong(m),what:[!E?`${rows.length} pagos`:dn>0?`+${dn} pagos`:dn<0?`${dn} pagos`:"pagos corregidos"],isNew:!E})}});
  if(P.cashRows&&P.cashRows.length){const id=farm+"-meta";const E=S.cash.get(id);const body={farm,rows:P.cashRows};if(!E||!eqv(E.rows,body.rows))plan.push({col:"cashflow",id,body,grp:"Flujo mensual",lab:"Estructura del flujo",what:["conceptos"],isNew:!E})}
  Object.entries(P.cash).forEach(([m,v])=>{const id=farm+"-"+m;const E=S.cash.get(id);const body={farm,month:m,v};
    if(!E||!eqv(E.v,v))plan.push({col:"cashflow",id,body,grp:"Flujo mensual",lab:mLong(m),what:[E?"cambios":"nuevo"],isNew:!E})});
  return plan;
}

async function readFile(slot,file){
  const I=S.imp;const st=$("#s-"+slot);st.textContent="Leyendo…";
  try{const wb=await XL.open(await file.arrayBuffer());const k=XP.kind(wb);
    if(!k)throw new Error("No reconozco este archivo: no tiene la hoja “Pesos” ni “FLUJO Mensual detallado”.");
    const target=k==="comparativo"?"comp":"flujo";
    const parsed=k==="comparativo"?await XP.parseComparativo(wb):await XP.parseFlujo(wb);
    I[target]={name:file.name,parsed};if(target!==slot)toast(`Lo cargué como ${target==="comp"?"Comparativo":"Flujo"}, que es lo que contiene.`);
    ["comp","flujo"].forEach(s=>{const e=$("#s-"+s);if(e&&I[s])e.innerHTML=`Leído: <b>${esc(I[s].name)}</b>`});
    rebuildPlan();showPlan();
  }catch(e){st.innerHTML=`<span class="dn">${esc(e.message||String(e))}</span>`}
}
function rebuildPlan(){const I=S.imp;const farm=I.farm||S.farm;I.plan=[...(I.comp?planComparativo(farm,I.comp.parsed):[]),...(I.flujo?planFlujo(farm,I.flujo.parsed):[])];
  // una parvada puede venir de los dos archivos: combinar en un solo documento
  const m=new Map();I.plan.forEach(p=>{const key=p.col+"/"+p.id;const o=m.get(key);if(!o){m.set(key,p);return}
    if(p.merge){o.body.close=p.body.close}else{p.body.close=o.body.close;o.body=p.body}o.what=[...o.what,...p.what];o.grp=o.grp==="Parvadas"?o.grp:p.grp});
  I.plan=[...m.values()]}
function showPlan(){
  const out=$("#impOut");if(!out)return;const I=S.imp;if(!I.comp&&!I.flujo){out.innerHTML="";return}
  const warns=[...(I.comp?I.comp.parsed.warn:[]),...(I.flujo?I.flujo.parsed.warn:[])];
  const plan=I.plan||[];const groups={};plan.forEach(p=>{(groups[p.grp]=groups[p.grp]||[]).push(p)});
  let h=`${warns.length?`<div class="banner warn">${warns.map(esc).join("<br>")}</div>`:""}
  <div class="card"><div class="card-h"><h3>Cambios encontrados</h3><span class="src">${plan.length?`${plan.filter(p=>p.isNew).length} nuevos · ${plan.filter(p=>!p.isNew).length} con cambios`:"Todo está igual que en el panel"}</span></div>
  ${Object.entries(groups).map(([g,ps])=>`<details ${ps.length<=12?"open":""}><summary><b>${esc(g)}</b> · ${ps.length}</summary><div class="hbar" style="grid-template-columns:minmax(120px,200px) 1fr;margin:8px 0">${ps.map(p=>`<span>${esc(p.lab)}${p.isNew?' <span class="pill good">nuevo</span>':""}</span><span class="src" style="font-size:12.5px">${esc(p.what.join(", "))}</span>`).join("")}</div></details>`).join("")}
  <div class="row" style="justify-content:space-between;margin-top:6px"><span class="note" id="impMsg"></span><div class="row"><button class="btn" id="impCancel">Cancelar</button><button class="btn primary" id="impGo" ${!plan.length||S.readonly||!S.db?"disabled":""}>Guardar ${plan.length} cambios</button></div></div></div>`;
  out.innerHTML=h;
  $("#impCancel").addEventListener("click",()=>{S.imp={};renderImportar()});
  $("#impGo").addEventListener("click",runImport);
}
async function runImport(){
  const I=S.imp;const plan=I.plan||[];const btn=$("#impGo"),msg=$("#impMsg");btn.disabled=true;$("#impCancel").disabled=true;
  let done=0,fail=[];const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const one=async p=>{for(let t=0;t<4;t++){try{await S.db.doc(p.col+"/"+p.id).set(JSON.parse(JSON.stringify(p.body)));return true}catch(e){const c=e&&e.code;if(c==="resource_exhausted"||c==="unavailable"){await sleep(800*(t+1)+Math.random()*400);continue}fail.push(`${p.lab}: ${e.message||c}`);return false}}fail.push(`${p.lab}: el servidor está ocupado`);return false};
  const queue=plan.slice();const worker=async()=>{while(queue.length){const p=queue.shift();await one(p);done++;msg.textContent=`Guardando… ${done} de ${plan.length}`}};
  await Promise.all([worker(),worker(),worker()]);
  if(fail.length){msg.innerHTML=`<span class="dn">Se guardaron ${plan.length-fail.length} de ${plan.length}. No se pudo: ${esc(fail.slice(0,3).join("; "))}${fail.length>3?"…":""}. Vuelve a presionar Guardar para reintentar.</span>`;btn.disabled=false;btn.textContent="Reintentar";$("#impCancel").disabled=false;I.plan=plan.filter(p=>fail.some(f=>f.startsWith(p.lab+":")));return}
  toast(`Listo: ${plan.length} cambios guardados`);S.farm=I.farm||S.farm;S.imp={};setTimeout(()=>setTab("panel"),600);
}

function getCell(f,mode,k,g){if(["placed","hAge","hWt","left"].includes(k))return f[k][g];if(k==="w0")return f.w[0][g];return f[k][mode][g]}
function setCell(f,mode,k,g,v){if(["placed","hAge","hWt","left"].includes(k)){f[k][g]=v;return}if(k==="w0"){f.w[0][g]=v;return}f[k][mode][g]=v}

  sl.disabled=!ff.length;
}
const VIEWS={panel:renderPanel,anual:renderAnual,flujo:renderFlujo,importar:renderImportar,reporte:renderReporte,semanal:renderSemanal,comparativo:renderComparativo,costos:renderCostos,pagos:renderPagos,apendice:renderApendice,captura:renderCaptura};
function render(){
  fillPickers();
  if(!VIEWS[S.tab])S.tab="panel";
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===S.tab));
  Object.keys(VIEWS).forEach(v=>$("#v-"+v).hidden=v!==S.tab);
  VIEWS[S.tab]();
  const g=$("#goCap");if(g)g.addEventListener("click",()=>setTab("captura"));
}
function setTab(t){S.tab=t;try{localStorage.setItem("cg.tab",t)}catch(e){}render();window.scrollTo({top:0})}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>setTab(t.dataset.tab)));
$("#farmSel").addEventListener("change",e=>{S.farm=e.target.value;S.sel=null;S.gWeek=null;S.draft=null;S.sim=null;S.costCyc=null;try{localStorage.setItem("cg.farm",S.farm)}catch(_){}render()});
$("#flockSel").addEventListener("change",e=>{S.sel=e.target.value;S.gWeek=null;S.draft=null;S.confirmDel=false;render()});

/* ---------- datos ---------- */
render();
(async()=>{
  const c=window.claude;
  if(!c||!c.use){S.loaded=true;$("#syncState").textContent="Sin conexión a los datos";render();return}
  c.use("downloads").then(d=>{S.dl=d;if(S.tab==="reporte")render()}).catch(()=>{});
  c.use("user").then(async u=>{if(!u)return;try{const w=await u.can("data.write");if(w===false){S.readonly=true;render()}}catch(e){}}).catch(()=>{});
  const db=await c.use("db");S.db=db;
  if(!db){S.loaded=true;$("#syncState").textContent="Sin conexión a los datos";render();return}
  let gotF=false,gotY=false;
  const rerender=()=>{if(!gotF)return;S.loaded=true;$("#syncState").textContent=`${S.flocks.size} parvadas · sincronizado`;
    if(S.tab==="captura"&&S.draft&&document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#v-captura")){fillPickers();return}
    render()};
  db.collection("flocks").onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>{if(d.exists){const o=norm(d.data());o._id=d.id;m.set(d.id,o)}});S.flocks=m;gotF=true;rerender()},
    err=>{$("#syncState").textContent="Error de conexión: "+(err.message||err.code)});
  db.collection("payments").onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>{if(d.exists){const o=Object.assign({},d.data());o._id=d.id;m.set(d.id,o)}});S.pay=m;if(gotF&&(S.tab==="pagos"||S.tab==="costos"))rerender()},()=>{});
  db.collection("cashflow").onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>{if(d.exists){const o=Object.assign({},d.data());o._id=d.id;m.set(d.id,o)}});S.cash=m;if(gotF&&(S.tab==="flujo"||S.tab==="panel"))rerender()},()=>{});
  db.collection("years").onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>{if(d.exists)m.set(d.id,d.data())});S.years=m;gotY=true;rerender()},()=>{});
})();
})();
</script>
</body>
</html>
